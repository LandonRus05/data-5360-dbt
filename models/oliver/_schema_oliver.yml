version: 2

models:
  - name: oliver_dim_customer
    description: "Oliver's Customer Dimension"
  - name: oliver_dim_date
    description: "Oliver's Date Dimension"
  - name: oliver_dim_employee
    description: "Oliver's Employee Dimension"
  - name: oliver_dim_product
    description: "Oliver's Product Dimension"
  - name: oliver_dim_store
    description: "Oliver's Store Dimension"
  - name: fact_sales
    description: "Oliver's Sales Fact (order line grain)"
  - name: sales
    description: "Semantic layer for sales analysis"
  - name: stg_employee_certifications
    description: |
      Staging model for employee certifications.
      Parses certification_json into certification_name, certification_cost, and certification_awarded_date.
      Each record represents one certification earned by an employee.
  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain of this table is employee + certification + date awarded.
      Each record represents one certification an employee received on a given date.